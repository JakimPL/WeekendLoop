name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --dev
      - run: uv run pytest tests --tb=short -q
      - run: uv run ruff check . && uv run ruff format --check .
