[project]
name = "pocketchat"
version = "0.1.0"
description = "A clickable mockup of Pocketchat, a chat assistant in the browser."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pocketchat = "pocketchat.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocketchat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
